<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Pillarthree Productions</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header" id="site-header">
        <div class="container nav-container">
            <a href="/" class="logo">
                <img src="/assets/images/logo.webp" alt="Pillarthree Productions Logo" class="logo-img">
            </a>
            <nav class="nav-menu" id="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/projects" class="nav-link active">Projects</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/contact" class="nav-link">Contact</a>
            </nav>
            <button class="mobile-menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <div id="projects-grid-view">
        <!-- Projects Header -->
        <section class="page-header reveal">
            <div class="container">
                <h1 class="section-title">Our Work</h1>
                <div class="filter-nav">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="commercial">Commercial</button>
                    <button class="filter-btn" data-filter="brand-film">Brand Film</button>
                    <button class="filter-btn" data-filter="music-video">Music Video</button>
                </div>
            </div>
        </section>

        <!-- Projects Grid -->
        <section class="section-padding" style="padding-top: var(--spacing-md);">
            <div class="container">
                <div class="projects-grid" id="portfolio-grid">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </section>
    </div>

    <!-- Project Details View (Hidden by default) -->
    <div id="project-details-view" style="display: none;">
        <!-- Project Hero (Video) -->
        <section class="project-hero reveal" id="hero-media-container">
            <div id="hero-thumbnail-wrapper" class="hero-thumbnail-wrapper">
                <img src="/assets/images/project1.webp" alt="Loading Project..." loading="lazy" id="hero-thumbnail">
                <div class="hero-loading-spinner"></div>
            </div>
            <div id="hero-video-wrapper" class="hero-video-wrapper" style="display: none;"></div>
        </section>

        <!-- Project Details -->
        <section class="container">
            <div class="project-meta-grid reveal" id="project-meta-grid">
                <!-- Dynamically populated via JS -->
            </div>
            
            <div class="project-body reveal">
                <h1 class="section-title" id="project-title"></h1>
                <p style="max-width: 800px; margin-top: var(--spacing-sm);" id="project-description"></p>
                
                <div class="project-gallery">
                    <!-- Unused since data doesn't provide gallery, but keeping for structure -->
                </div>
            </div>
            
            <!-- Navigation -->
            <div class="project-nav">
                <a href="#" class="btn btn-secondary" id="btn-prev">← Previous Project</a>
                <a href="/projects/" class="btn btn-outline" id="btn-all">All Projects</a>
                <a href="#" class="btn btn-secondary" id="btn-next">Next Project →</a>
            </div>
        </section>
    </div>

    <!-- Project Not Found View (Hidden by default) -->
    <div id="project-not-found-view" style="display: none; text-align: center; padding: 100px 20px;">
        <h2 style="margin-bottom: 20px;">Project not found</h2>
        <p style="margin-bottom: 30px; color: var(--text-secondary);">The project you are looking for does not exist or has been removed.</p>
        <a href="/projects/" class="btn btn-primary">Back to Projects</a>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-top">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.webp" alt="Pillarthree Productions Logo" style="height: 30px;">
                </a>
                <nav class="footer-nav">
                    <a href="/projects">Projects</a>
                    <a href="/about">About</a>
                    <a href="/blog">Blog</a>
                    <a href="/contact">Contact</a>
                </nav>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Pillarthree Productions. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.instagram.com/pillarthree_productions/" target="_blank">Instagram</a>
                    <a href="https://www.youtube.com/@PillarThreeProductions" target="_blank">YouTube</a>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="/assets/js/app.js"></script>
</body>

</html>
